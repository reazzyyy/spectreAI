# Quality gate for every PR: install → migrate → test.
# Postgres matches local docker-compose credentials (CI-only DB, not production).
name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: spectre
          POSTGRES_PASSWORD: spectre
          POSTGRES_DB: spectre
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spectre -d spectre"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://spectre:spectre@localhost:5432/spectre
      # Present for packages that read it; current unit suite does not need a live Redis.
      REDIS_URL: redis://localhost:6379
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Prisma migrations
        run: pnpm --filter @spectre/db migrate:deploy

      - name: Run tests
        run: pnpm test
